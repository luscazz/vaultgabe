# Configuracao do VaultGabe no Render (Blueprint).
services:
  - type: web
    name: vaultgabe
    runtime: node
    region: ohio
    plan: free
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /api/saude
    autoDeployTrigger: commit
    envVars:
      - key: DATABASE_URL   # preenchido no painel do Render
        sync: false
      - key: NODE_ENV
        value: production
